output_dir = "gs/test"

run_duration = 600
run_max_attempts = 8
backoff_initial_secs = 15
early_stop_dur = 60
early_stop_check_interval = 5
early_stop_fps_threshold = 114

# Per-zone ready thresholds (milli-°C): zone0=soc_max / zone44=tsx_ntc / zone53=battery
ready_temp_soc_max = 60000
ready_temp_tsx = 48000
ready_temp_battery = 42000

[grid]
blc_boost = [100]
qr_t2wnt_x = [-30, -10]
rescue_enhance_f = [25]
"qr_t2wnt_y_p,qr_t2wnt_y_n" = [0, 30]
"limit_rfreq,limit_rfreq_m" = [[2700000, 2600000], [2800000, 2660000]]
"limit_cfreq,limit_cfreq_m" = [[2800000, 2500000], [2800000, 2660000]]
gcc_enable = [1, 2]

[perfetto]
config_dir = "./perfetto_configs"

[power]
enable = true
warmup = true

# Runs per grid combo; run order = this many independently shuffled
# grid passes (shuffle_seed: null = random seed, printed at startup)
#repeats = 1
#shuffle_seed = null

[sgame]
package_name = "com.tencent.tmgp.sgame"
package_name_short = "cent.tmgp.sgame"
resource_dir = "./resources/sgame"

