output_dir = "gs/test"

run_duration = 600
run_max_attempts = 8
backoff_initial_secs = 15
early_stop_dur = 60
early_stop_check_interval = 5
early_stop_fps_threshold = 0

repeats = 3
shuffle_seed = 1017

# Per-zone ready thresholds (milli-°C): zone0=soc_max / zone44=tsx_ntc / zone53=battery
# Defaults are cold placeholders; see the per-game docs for recommended values
ready_temp_soc_max = 35000
ready_temp_tsx = 35000
ready_temp_battery = 35000

webui_port = 8787

[grid]
blc_boost = [100]
qr_t2wnt_x = [-30, -10]
rescue_enhance_f = [25]
"qr_t2wnt_y_p,qr_t2wnt_y_n" = [0, 30]
"limit_rfreq,limit_rfreq_m" = [[2700000, 2600000], [2800000, 2660000]]
"limit_cfreq,limit_cfreq_m" = [[2800000, 2500000], [2800000, 2660000]]
gcc_enable = [1, 2]

[perfetto]
config_dir = "./perfetto_configs"

[power]
enable = true
warmup = true
charge_target = 100
charge_wait_max = 7200
warmup_secs = 900

[sgame]
package_name = "com.tencent.tmgp.sgame"
package_name_short = "cent.tmgp.sgame"
resource_dir = "./resources/sgame"
